[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentics"
version = "0.1.0"
description = "Multi-agent framework that transforms requirements documents into PlantUML diagrams"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "google-generativeai>=0.8.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.8.0",
    "black>=24.0.0",
]

[project.scripts]
agentics = "agentics.orchestrator:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentics"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
